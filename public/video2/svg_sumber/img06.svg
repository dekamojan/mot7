<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960">
  <!-- Contact Shadows -->
  <ellipse cx="360" cy="850" rx="220" ry="60" fill="#222222" fill-opacity="0.12"/>
  <ellipse cx="580" cy="820" rx="80" ry="30" fill="#222222" fill-opacity="0.12"/>

  <!-- Empty Chair (Right) -->
  <g transform="translate(520, 700)">
    <!-- Legs -->
    <rect x="0" y="50" width="8" height="80" fill="#2c53a2"/>
    <rect x="50" y="80" width="8" height="80" fill="#2c53a2"/>
    <rect x="-40" y="80" width="8" height="80" fill="#2c53a2"/>
    <!-- Seat -->
    <polygon points="-50,50 0,21 50,50 0,79" fill="#628ce0"/>
    <polygon points="-50,50 0,79 0,89 -50,60" fill="#3b6fd8"/>
    <polygon points="0,79 50,50 50,60 0,89" fill="#2c53a2"/>
    <!-- Backrest -->
    <polygon points="-50,50 -50,-20 -42,-25 -42,45" fill="#3b6fd8"/>
  </g>

  <!-- Desk -->
  <g transform="translate(360, 650)">
    <!-- Legs -->
    <rect x="-135" y="0" width="10" height="180" fill="#2c53a2"/>
    <rect x="125" y="0" width="10" height="180" fill="#2c53a2"/>
    <rect x="-5" y="80" width="10" height="120" fill="#2c53a2"/>
    <!-- Tabletop -->
    <polygon points="-150,0 0,-87 150,0 0,87" fill="#628ce0"/>
    <polygon points="-150,0 0,87 0,102 -150,15" fill="#3b6fd8"/>
    <polygon points="0,87 150,0 150,15 0,102" fill="#2c53a2"/>
  </g>

  <!-- Tired Girl Seated -->
  <g transform="translate(300, 630)">
    <!-- Legs (Trousers) -->
    <g transform="translate(-40, 50)">
      <polygon points="0,0 40,23 40,100 0,77" fill="#faf6ef"/>
      <polygon points="40,23 80,0 80,77 40,100" fill="#e6dfd5"/>
      <polygon points="0,0 40,-23 80,0 40,23" fill="#ffffff"/>
    </g>

    <!-- Torso (Slumped forward) -->
    <g transform="translate(-20, -50) rotate(10)">
      <polygon points="-50,100 50,157 50,280 -50,223" fill="#1f9d8a"/>
      <polygon points="50,157 150,100 150,223 50,280" fill="#14695c"/>
      <polygon points="-50,100 50,43 150,100 50,157" fill="#43c6b2"/>
    </g>

    <!-- Arms (Resting on desk) -->
    <g transform="translate(20, 20)">
      <polygon points="0,0 80,46 80,66 0,20" fill="#1f9d8a"/>
      <polygon points="80,46 100,35 100,55 80,66" fill="#14695c"/>
      <polygon points="0,0 20,-11 100,35 80,46" fill="#43c6b2"/>
    </g>

    <!-- Head (Tilted down) -->
    <g transform="translate(40, -60)">
      <!-- Neck -->
      <polygon points="-10,50 10,62 10,80 -10,68" fill="#faf6ef"/>
      <polygon points="10,62 30,50 30,68 10,80" fill="#e6dfd5"/>
      <!-- Face -->
      <polygon points="-40,0 20,35 20,100 -40,65" fill="#faf6ef"/>
      <polygon points="20,35 80,0 80,65 20,100" fill="#e6dfd5"/>
      <polygon points="-40,0 20,-35 80,0 20,35" fill="#ffffff"/>
      <!-- Hair (Bob Cut) -->
      <g transform="translate(0, -15)">
        <polygon points="-50,10 20,-30 90,10 20,50" fill="#222222"/>
        <polygon points="-50,10 -30,22 -30,90 -50,78" fill="#222222"/>
        <polygon points="70,22 90,10 90,78 70,90" fill="#111111"/>
        <polygon points="-30,22 20,50 20,65 -30,37" fill="#222222"/>
        <polygon points="20,50 70,22 70,37 20,65" fill="#111111"/>
      </g>
      <!-- Tired Eyes -->
      <line x1="-10" y1="45" x2="10" y2="55" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
      <line x1="40" y1="55" x2="60" y2="45" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Glowing Smartphone (on desk) -->
  <g transform="translate(420, 620)">
    <polygon points="0,0 20,12 20,5 0,-7" fill="#f59e0b"/>
    <polygon points="20,12 35,3 35,-4 20,5" fill="#d98c0a"/>
    <polygon points="0,-7 15,-16 35,-4 20,5" fill="#fbbf24"/>
    <!-- Glow effect -->
    <circle cx="17" cy="0" r="30" fill="#f59e0b" fill-opacity="0.15"/>
  </g>

  <!-- Muted Chat Bubbles (Floating) -->
  <g transform="translate(150, 500)">
    <polygon points="0,0 40,23 40,10 0,-13" fill="#ffffff" fill-opacity="0.4"/>
    <polygon points="0,-13 40,-36 50,-30 10,-7" fill="#ffffff" fill-opacity="0.4"/>
  </g>
  <g transform="translate(580, 450)">
    <polygon points="0,0 30,17 30,8 0,-9" fill="#f59e0b" fill-opacity="0.3"/>
    <polygon points="0,-9 30,-26 40,-20 10,-3" fill="#fbbf24" fill-opacity="0.3"/>
  </g>
</svg>