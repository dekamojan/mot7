<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960">
  <!-- Contact Shadow -->
  <ellipse cx="360" cy="880" rx="220" ry="60" fill="#222222" fill-opacity="0.12"/>

  <!-- Background Sunrise (Symbolic) -->
  <circle cx="580" cy="220" r="140" fill="#f59e0b" fill-opacity="0.3"/>
  <circle cx="580" cy="220" r="100" fill="#f59e0b" fill-opacity="0.6"/>
  <circle cx="580" cy="220" r="60" fill="#f59e0b"/>

  <!-- Path / Ground Slab -->
  <g transform="translate(360, 840)">
    <polygon points="-180,0 0,104 180,0 0,-104" fill="#ffffff"/>
    <polygon points="-180,0 0,104 0,124 -180,20" fill="#faf6ef"/>
    <polygon points="0,104 180,0 180,20 0,124" fill="#e6dfd5"/>
  </g>

  <!-- Character: Trousers (Cream/Beige) -->
  <!-- Left Leg (Back, stepping) -->
  <g transform="translate(300, 720)">
    <polygon points="-25,-14 0,0 25,-14 0,-28" fill="#ffffff"/>
    <polygon points="-25,-14 0,0 0,100 -25,86" fill="#faf6ef"/>
    <polygon points="0,0 25,-14 25,86 0,100" fill="#e6dfd5"/>
  </g>
  <!-- Right Leg (Forward, stepping) -->
  <g transform="translate(420, 780)">
    <polygon points="-25,-14 0,0 25,-14 0,-28" fill="#ffffff"/>
    <polygon points="-25,-14 0,0 0,100 -25,86" fill="#faf6ef"/>
    <polygon points="0,0 25,-14 25,86 0,100" fill="#e6dfd5"/>
  </g>

  <!-- Character: Torso (Teal Sweater) -->
  <g transform="translate(360, 600)">
    <polygon points="-60,-35 0,0 60,-35 0,-70" fill="#43c6b2"/>
    <polygon points="-60,-35 0,0 0,160 -60,125" fill="#1f9d8a"/>
    <polygon points="0,0 60,-35 60,125 0,160" fill="#14695c"/>
  </g>

  <!-- Arms -->
  <!-- Right Arm (holding phone, forward) -->
  <g transform="translate(420, 580)">
    <polygon points="0,0 40,23 40,43 0,20" fill="#1f9d8a"/>
    <polygon points="40,23 60,12 60,32 40,43" fill="#14695c"/>
    <polygon points="0,0 20,-11 60,12 40,23" fill="#43c6b2"/>
    <!-- Glowing Phone -->
    <g transform="translate(45, 15)">
      <polygon points="0,0 15,9 15,35 0,26" fill="#1f9d8a"/>
      <polygon points="15,9 30,0 30,26 15,35" fill="#14695c"/>
      <polygon points="0,0 15,-9 30,0 15,9" fill="#f59e0b"/>
    </g>
  </g>
  <!-- Left Arm (swinging back) -->
  <g transform="translate(300, 580)">
    <polygon points="0,0 -30,17 -30,70 0,53" fill="#1f9d8a"/>
    <polygon points="0,0 20,-11 -10,6 0,17" fill="#43c6b2" opacity="0"/> <!-- hidden top -->
    <polygon points="-30,17 -50,5 -50,58 -30,70" fill="#14695c"/>
  </g>

  <!-- Neck -->
  <g transform="translate(360, 485)">
    <polygon points="-15,-9 0,0 15,-9 0,-18" fill="#ffffff"/>
    <polygon points="-15,-9 0,0 0,15 -15,6" fill="#faf6ef"/>
    <polygon points="0,0 15,-9 15,6 0,15" fill="#e6dfd5"/>
  </g>

  <!-- Head -->
  <g transform="translate(360, 420)">
    <!-- Face -->
    <polygon points="-45,-26 0,0 45,-26 0,-52" fill="#ffffff"/>
    <polygon points="-45,-26 0,0 0,80 -45,54" fill="#faf6ef"/>
    <polygon points="0,0 45,-26 45,54 0,80" fill="#e6dfd5"/>
    
    <!-- Facial Features (Confident, looking up) -->
    <line x1="-25" y1="10" x2="-10" y2="18" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="18" x2="25" y2="10" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <path d="M -10 45 Q 0 55 10 45" fill="none" stroke="#222222" stroke-width="3" stroke-linecap="round"/>

    <!-- Hair (Ink Bob) -->
    <g transform="translate(0, -15)">
      <polygon points="-55,-32 0,0 55,-32 0,-64" fill="#222222"/>
      <polygon points="-55,-32 -55,40 -35,51 -35,-21" fill="#222222"/>
      <polygon points="55,-32 55,40 35,51 35,-21" fill="#111111"/>
      <polygon points="-35,51 0,72 35,51 35,35 0,56 -35,35" fill="#222222"/>
    </g>
  </g>

  <!-- Floating Chat Bubbles -->
  <!-- Left Bubble -->
  <g transform="translate(180, 450)">
    <polygon points="0,0 40,23 40,60 0,37" fill="#ffffff" fill-opacity="0.9"/>
    <polygon points="40,23 50,17 50,54 40,60" fill="#e6dfd5" fill-opacity="0.9"/>
    <polygon points="0,0 40,-23 50,-17 10,6" fill="#ffffff"/>
  </g>
  <!-- Right Bubble (Amber) -->
  <g transform="translate(540, 520)">
    <polygon points="0,0 30,17 30,45 0,28" fill="#f59e0b" fill-opacity="0.8"/>
    <polygon points="30,17 40,11 40,39 30,45" fill="#d98c0a" fill-opacity="0.8"/>
    <polygon points="0,0 30,-17 40,-11 10,6" fill="#fbbf24"/>
  </g>
  <!-- Top Bubble -->
  <g transform="translate(480, 340)">
    <polygon points="0,0 35,20 35,48 0,28" fill="#ffffff" fill-opacity="0.9"/>
    <polygon points="35,20 45,14 45,42 35,48" fill="#e6dfd5" fill-opacity="0.9"/>
    <polygon points="0,0 35,-20 45,-14 10,6" fill="#ffffff"/>
  </g>
</svg>