<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960">
  <!-- Contact Shadow -->
  <ellipse cx="360" cy="880" rx="180" ry="50" fill="#222222" fill-opacity="0.12"/>

  <!-- Trousers (Beige/Cream) -->
  <g transform="translate(0, 150)">
    <!-- Left Leg -->
    <polygon points="320,600 360,623 360,730 320,707" fill="#faf6ef"/>
    <polygon points="360,623 400,600 400,707 360,730" fill="#e6dfd5"/>
    <polygon points="320,600 360,577 400,600 360,623" fill="#ffffff"/>
  </g>

  <!-- Torso / Teal Sweater -->
  <g>
    <!-- Main Body Block -->
    <polygon points="260,520 360,577 360,750 260,693" fill="#1f9d8a"/>
    <polygon points="360,577 460,520 460,693 360,750" fill="#14695c"/>
    <polygon points="260,520 360,463 460,520 360,577" fill="#43c6b2"/>

    <!-- Crossed Arm Left (Foreground) -->
    <g transform="translate(0, -20)">
      <polygon points="280,560 420,640 420,690 280,610" fill="#1f9d8a"/>
      <polygon points="420,640 440,630 440,680 420,690" fill="#14695c"/>
      <polygon points="280,560 300,550 440,630 420,640" fill="#43c6b2"/>
    </g>
    
    <!-- Crossed Arm Right (Background/Under) -->
    <g transform="translate(0, -50)">
      <polygon points="440,560 300,640 300,690 440,610" fill="#1f9d8a"/>
      <polygon points="300,640 280,630 280,680 300,690" fill="#14695c"/>
      <polygon points="440,560 420,550 280,630 300,640" fill="#43c6b2"/>
    </g>
  </g>

  <!-- Glowing Smartphone (held in arm fold) -->
  <g transform="translate(350, 540)">
    <polygon points="0,0 30,17 30,60 0,43" fill="#1f9d8a"/>
    <polygon points="30,17 60,0 60,43 30,60" fill="#14695c"/>
    <polygon points="0,0 30,-17 60,0 30,17" fill="#f59e0b"/>
  </g>

  <!-- Neck -->
  <polygon points="340,460 360,472 360,490 340,478" fill="#faf6ef"/>
  <polygon points="360,472 380,460 380,478 360,490" fill="#e6dfd5"/>

  <!-- Head (Cream) -->
  <g transform="translate(0, -20)">
    <polygon points="300,380 360,415 360,500 300,465" fill="#faf6ef"/>
    <polygon points="360,415 420,380 420,465 360,500" fill="#e6dfd5"/>
    <polygon points="300,380 360,345 420,380 360,415" fill="#ffffff"/>
    
    <!-- Facial Features (Sincere expression) -->
    <line x1="325" y1="420" x2="345" y2="432" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <line x1="375" y1="432" x2="395" y2="420" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <path d="M 350 460 Q 360 470 370 460" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Hair (Ink Bob Cut) -->
  <g transform="translate(0, -35)">
    <!-- Top -->
    <polygon points="290,380 360,335 430,380 360,425" fill="#222222"/>
    <!-- Left Side -->
    <polygon points="290,380 310,392 310,480 290,468" fill="#222222"/>
    <!-- Right Side -->
    <polygon points="410,392 430,380 430,468 410,480" fill="#111111"/>
    <!-- Back/Sides depth -->
    <polygon points="310,392 360,425 360,440 310,407" fill="#222222"/>
    <polygon points="360,425 410,392 410,407 360,440" fill="#111111"/>
  </g>

  <!-- Floating Digital Chat Bubbles -->
  <!-- Bubble 1 (Left) -->
  <g transform="translate(180, 400)">
    <polygon points="0,0 50,29 50,10 0,-19" fill="#ffffff" fill-opacity="0.9"/>
    <polygon points="50,29 60,23 60,4 50,10" fill="#e6dfd5" fill-opacity="0.9"/>
    <polygon points="0,-19 50,-48 60,-42 10,-13" fill="#ffffff"/>
  </g>
  <!-- Bubble 2 (Right, Amber) -->
  <g transform="translate(520, 480)">
    <polygon points="0,0 40,23 40,10 0,-13" fill="#f59e0b" fill-opacity="0.8"/>
    <polygon points="40,23 50,17 50,4 40,10" fill="#d98c0a" fill-opacity="0.8"/>
    <polygon points="0,-13 40,-36 50,-30 10,-7" fill="#fbbf24"/>
  </g>
  <!-- Bubble 3 (Top Right) -->
  <g transform="translate(500, 320)">
    <polygon points="0,0 60,35 60,15 0,-20" fill="#ffffff" fill-opacity="0.9"/>
    <polygon points="60,35 70,29 70,9 60,15" fill="#e6dfd5" fill-opacity="0.9"/>
    <polygon points="0,-20 60,-55 70,-49 10,-14" fill="#ffffff"/>
  </g>
</svg>